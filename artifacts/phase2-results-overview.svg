<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="70" y="78" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#0f172a">AMC Phase 2 — Evaluation Overview</text>
  <text x="70" y="118" font-family="Arial, sans-serif" font-size="20" fill="#475569">Raw I/Q signals → CNN classifier → reproducible evaluation outputs</text>

  <rect x="70" y="175" width="360" height="180" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="105" y="225" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1e3a8a">1. Dataset preparation</text>
  <text x="105" y="267" font-family="Arial, sans-serif" font-size="19" fill="#1e40af">RadioML 2016.10a pickle</text>
  <text x="105" y="298" font-family="Arial, sans-serif" font-size="19" fill="#1e40af">Power normalization</text>
  <text x="105" y="329" font-family="Arial, sans-serif" font-size="19" fill="#1e40af">70 / 15 / 15 stratified split</text>

  <path d="M450 265 H530" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="550" y="175" width="360" height="180" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="585" y="225" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#14532d">2. CNN training</text>
  <text x="585" y="267" font-family="Arial, sans-serif" font-size="19" fill="#166534">3 convolutional blocks</text>
  <text x="585" y="298" font-family="Arial, sans-serif" font-size="19" fill="#166534">AdamW + class weights</text>
  <text x="585" y="329" font-family="Arial, sans-serif" font-size="19" fill="#166534">Cosine learning-rate schedule</text>

  <path d="M930 265 H1010" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="1030" y="175" width="300" height="180" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="1065" y="225" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#78350f">3. Results</text>
  <text x="1065" y="267" font-family="Arial, sans-serif" font-size="19" fill="#92400e">Test accuracy</text>
  <text x="1065" y="298" font-family="Arial, sans-serif" font-size="19" fill="#92400e">Confusion matrix</text>
  <text x="1065" y="329" font-family="Arial, sans-serif" font-size="19" fill="#92400e">Accuracy by SNR</text>

  <text x="70" y="430" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Generated evaluation artifacts</text>
  <rect x="70" y="465" width="395" height="235" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="100" y="510" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#334155">Checkpoint</text>
  <text x="100" y="548" font-family="monospace" font-size="18" fill="#475569">artifacts/amc.pt</text>
  <text x="100" y="595" font-family="Arial, sans-serif" font-size="18" fill="#475569">Stores model weights,</text>
  <text x="100" y="625" font-family="Arial, sans-serif" font-size="18" fill="#475569">class names, and shape.</text>

  <rect x="500" y="465" width="395" height="235" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="530" y="510" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#334155">Confusion matrix</text>
  <g transform="translate(560 545)">
    <rect width="170" height="120" fill="#eff6ff" stroke="#2563eb"/>
    <path d="M0 30H170M0 60H170M0 90H170M42.5 0V120M85 0V120M127.5 0V120" stroke="#93c5fd"/>
    <rect x="0" y="0" width="42.5" height="30" fill="#2563eb"/>
    <rect x="85" y="60" width="42.5" height="30" fill="#60a5fa"/>
    <rect x="127.5" y="90" width="42.5" height="30" fill="#1d4ed8"/>
  </g>
  <text x="755" y="605" font-family="Arial, sans-serif" font-size="18" fill="#475569">Saved as PNG</text>
  <text x="755" y="635" font-family="monospace" font-size="15" fill="#475569">artifacts/confusion-</text>
  <text x="755" y="658" font-family="monospace" font-size="15" fill="#475569">matrix.png</text>

  <rect x="930" y="465" width="400" height="235" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="960" y="510" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#9a3412">Important note</text>
  <text x="960" y="555" font-family="Arial, sans-serif" font-size="18" fill="#9a3412">Measured values are produced</text>
  <text x="960" y="585" font-family="Arial, sans-serif" font-size="18" fill="#9a3412">when the RadioML dataset is</text>
  <text x="960" y="615" font-family="Arial, sans-serif" font-size="18" fill="#9a3412">passed to scripts/train.py</text>
  <text x="960" y="655" font-family="Arial, sans-serif" font-size="18" fill="#9a3412">and scripts/evaluate.py.</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
